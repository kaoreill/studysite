<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study</title>
  <!-- Applies any stored theme override before first paint, so there's no flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var state = JSON.parse(localStorage.getItem("studysite:v1"));
        if (state && (state.theme === "light" || state.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", state.theme);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/common.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__name">Study</span>
      <button class="theme-toggle" type="button" data-theme-toggle>Toggle theme</button>
    </div>
  </header>

  <div class="page">
    <main>
      <p id="file-hint" class="fatal-error" hidden>
        You're opening this file directly — run it through a local server (see the README) so it can load its data.
      </p>

      <div class="hero">
        <h1 class="hero__title">DTU Autumn Exam Prep</h1>
        <p class="hero__stat" id="hero-stat"></p>
      </div>

      <ul class="module-list" id="module-list"></ul>
    </main>
  </div>

  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
